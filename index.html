<script>(()=>{'use strict';

const xpFor=l=>Math.floor(100*Math.pow(Math.max(0,l-1),1.75)),levelFor=x=>{let l=1;while(l<99&&x>=xpFor(l+1))l++;return l};
let state={coins:24,inv:{},xp:{},equipped:'bronze',running:false,progress:0,focus:'mining'};try{const d=JSON.parse(localStorage.getItem(SAVE)||'null');if(d)state={...state,...d,running:false,progress:0,inv:d.inv||d.inventory||{}}}catch(e){}for(const k in skills)state.xp[k]=state.xp[k]||0;
const $=s=>document.querySelector(s),canvas=$('#scene'),ctx=canvas.getContext('2d'),viewport=$('#viewport');let W=0,H=0,D=1;function resize(){const r=viewport.getBoundingClientRect();D=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=W*D;canvas.height=H*D}new ResizeObserver(resize).observe(viewport);resize();
function save(){try{localStorage.setItem(SAVE,JSON.stringify(state));$('#save-status').textContent='● SAVED'}catch(e){$('#save-status').textContent='● UNSAVED'}}function count(id){return state.inv[id]||0}function add(id,n=1){state.inv[id]=(state.inv[id]||0)+n}function remove(id,n=1){if(count(id)<n)return false;state.inv[id]-=n;if(!state.inv[id])delete state.inv[id];return true}
function log(t){const e=document.createElement('div');e.className='log-entry';e.innerHTML=t;$('#log-lines').prepend(e);while($('#log-lines').children.length>5)$('#log-lines').lastChild.remove()}let toastTimer;function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('show'),1900)}
function render(){let html='';for(const [k,[name,icon]] of Object.entries(skills)){const x=state.xp[k]||0,l=levelFor(x),pct=Math.min(100,(x-xpFor(l))/(xpFor(l+1)-xpFor(l))*100);html+=`<div class="skill"><div class="skill-icon">${icon}</div><div><div class="skill-name">${name}</div><div class="skill-xp">${x.toLocaleString()} xp</div><div class="xp-track"><div class="xp-fill" style="width:${pct}%"></div></div></div><div class="skill-level">${l}</div></div>`}$('#skills').innerHTML=html;const k=state.focus,x=state.xp[k]||0,l=levelFor(x);$('#focus-name').textContent=skills[k][0]+' level';$('#focus-level').textContent=l;$('#level-next').textContent=`${x} / ${xpFor(l+1)} xp to level ${l+1}`;$('#focus-fill').style.width=`${Math.min(100,(x-xpFor(l))/(xpFor(l+1)-xpFor(l))*100)}%`;const names={copper:['🟠','Copper ore',3],tin:['⚪','Tin ore',3],iron:['🔘','Iron ore',8],coal:['⚫','Coal',10],bronze:['🟤','Bronze bar',12],logs:['🪵','Oak logs',4],fish:['🐟','River trout',8],cooked:['🍖','Grilled trout',15],gem:['💎','Raw gemstone',35]};const entries=Object.entries(state.inv).filter(([,n])=>n>0);$('#inv-cap').textContent=`${entries.length} / 24`;$('#inventory').innerHTML=Array.from({length:24},(_,i)=>{const [id,n]=entries[i]||[];if(!id)return '<div class="slot empty"></div>';return `<div class="slot" data-id="${id}" title="${names[id]?.[1]||id}">${names[id]?.[0]||'📦'}<span class="count">${n}</span></div>`}).join('');$('#inventory').querySelectorAll('.slot:not(.empty)').forEach(el=>el.onclick=()=>{const id=el.dataset.id,n=count(id),spec=names[id]||['','Item',2],v=spec[2]*n;state.coins+=v;delete state.inv[id];toast(`Sold ${n} × ${spec[1]} for ${v} gp`);log(`Sold <b>${n} ${spec[1]}</b> for ${v} gp.`);render();save()});$('#coins').textContent=state.coins}

// A small locally-rendered 3D world: perspective-projected geometry, no downloaded assets.
const player={x:0,z:0,walk:0,vx:0,vz:0,moving:false}, camera={yaw:0}, stations=[

const props=[];let seed=7481;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}for(let i=0;i<100;i++){const x=(rand()-.5)*100,z=(rand()-.5)*110;if(Math.abs(x)<9&&Math.abs(z)<12)continue;if(Math.hypot(x+18,z-35)<9||Math.hypot(x-18,z-32)<9||Math.hypot(x+26,z+18)<10||Math.hypot(x-25,z+22)<10)continue;props.push({x,z,kind:rand()<.56?'tree':'rock',s:.6+rand()*.9})}
function project(x,y,z){const dx=x-player.x,dz=z-player.z,ang=camera.yaw,rx=dx*Math.cos(ang)-dz*Math.sin(ang),rz=dx*Math.sin(ang)+dz*Math.cos(ang);const depth=rz+10;if(depth<.3)return null;const f=Math.min(W,H)*.92;return {x:W*.5+rx*f/depth,y:H*.53-(y-2.1)*f/depth+f*.23/depth,scale:f/depth,depth}}
function poly3(points,color){const p=points.map(v=>project(v[0],v[1],v[2]));if(p.some(v=>!v))return;ctx.beginPath();ctx.moveTo(p[0].x,p[0].y);for(let i=1;i<p.length;i++)ctx.lineTo(p[i].x,p[i].y);ctx.closePath();ctx.fillStyle=color;ctx.fill();ctx.strokeStyle='#1f302455';ctx.lineWidth=1;ctx.stroke()}
function box(x,y,z,sx,sy,sz,color,light){const a=[x-sx/2,y,z-sz/2],b=[x+sx/2,y,z-sz/2],c=[x+sx/2,y,z+sz/2],d=[x-sx/2,y,z+sz/2],A=a.map((v,i)=>v+(i===1?sy:0)),B=b.map((v,i)=>v+(i===1?sy:0)),C=c.map((v,i)=>v+(i===1?sy:0)),D=d.map((v,i)=>v+(i===1?sy:0));poly3([a,b,B,A],light||color);poly3([b,c,C,B],color);poly3([c,d,D,C],shade(color));poly3([A,B,C,D],light||color)}
function shade(c){return c==='#664b35'?'#493729':c==='#6e8c56'?'#547343':c==='#6c6558'?'#514c43':c==='#9b8054'?'#755f40':'#52665a'}
function tree(x,z,s=1){const base=project(x,0,z);if(!base)return;const q=base.scale*s;box(x,0,z,.38*s,2.1*s,.38*s,'#664b35');for(let i=0;i<3;i++){const y=1.1*s+i*.85*s,r=(1.1-i*.22)*s;poly3([[x,y,z],[x-r,y-.2*s,z],[x,y+1.55*s,z],[x+r,y-.2*s,z]],i===0?'#426b49':'#527c50');poly3([[x,y,z-r*.45],[x-r,y-.2*s,z],[x,y+1.55*s,z],[x,y-.2*s,z+r*.45]],i===0?'#365d40':'#426b44')} }
function drawStation(s,t){const {x,z}=s;const ground=project(x,0,z);if(!ground)return;ctx.save();ctx.globalAlpha=.35;ctx.fillStyle='#19271e';ctx.beginPath();ctx.ellipse(ground.x,ground.y,ground.scale*1.9,ground.scale*.55,0,0,Math.PI*2);ctx.fill();ctx.restore();
 if(s.type==='mine'){box(x,0,z,7,3.8,1,'#71634d');poly3([[x-4,2,z+.54],[x,5.3,z+.54],[x+4,2,z+.54]],'#493f33');poly3([[x-2.6,1.5,z+.58],[x,3.8,z+.58],[x+2.6,1.5,z+.58]],'#17201e');box(x-5,.3,z+2,1.5,1.2,1.2,'#77786b');box(x+5,.3,z+2,1.6,1.1,1.2,'#a17a4b')}
 if(s.type==='forge'){box(x,0,z,6,3.5,4,'#866c4c');poly3([[x-3,3.4,z-2],[x,5.8,z-2],[x+3,3.4,z-2]],'#5b5140');poly3([[x-3,3.4,z+2],[x,5.8,z+2],[x+3,3.4,z+2]],'#655743');box(x-3.5,0,z+2,1,3,1,'#614a36');box(x+4,0,z+1,2,.8,1.2,'#676e68');box(x-1,0,z+3.3,1.1,1.4,.8,'#55483b');poly3([[x-1.42,.42,z+3.72],[x-1,.42,z+3.72],[x-1.22,1.05,z+3.72]],'#bd7044');poly3([[x-1.17,.42,z+3.73],[x-.83,.42,z+3.73],[x-1, .82,z+3.73]],'#dfb16e')}
 if(s.type==='woods'){for(let i=0;i<5;i++)tree(x+(i-2)*2.1,z+(i%2)*2,1.1)}
 if(s.type==='river'){poly3([[x-10,0,z-2],[x+10,0,z-2],[x+12,0,z+5],[x-8,0,z+5]],'#528d91');for(let i=0;i<4;i++)box(x-7+i*4,.08,z+1,.12,.02,3,'#a6d1c0');box(x,0,z-4,8,.35,1,'#756047');for(let i=-1;i<=1;i++)box(x+i*3,.4,z-4,.18,.9,.18,'#594c39')}
 const label=project(x,6,z);if(label&&label.scale>4){ctx.fillStyle='#e7e2ca';ctx.font=`${Math.max(10,Math.min(16,label.scale*1.5))}px Georgia`;ctx.textAlign='center';ctx.shadowColor='#17221f';ctx.shadowBlur=6;ctx.fillText(s.name,label.x,label.y-8);ctx.shadowBlur=0}}
function drawPlayer(t){const x=player.x,z=player.z,bob=player.moving?Math.sin(t*9)*.035:0;const foot=project(x,0,z);if(!foot)return;const sc=foot.scale*.75;ctx.save();ctx.translate(foot.x,foot.y);ctx.scale(sc,sc);ctx.fillStyle='#1f2c2488';ctx.beginPath();ctx.ellipse(0,0,1.3,.32,0,0,Math.PI*2);ctx.fill();ctx.translate(0,-bob*20);ctx.fillStyle='#40372e';ctx.fillRect(-.54,-1.15,.42,1.1);ctx.fillRect(.12,-1.15,.42,1.1);ctx.fillStyle='#786447';ctx.fillRect(-.72,-2.55,1.38,1.55);ctx.fillStyle='#ae8a5e';ctx.fillRect(-.48,-3.3,.98,.85);ctx.fillStyle='#544a38';ctx.fillRect(-.64,-3.48,1.2,.3);ctx.fillStyle='#d2b779';ctx.fillRect(-.58,-3.68,.78,.23);ctx.restore();}
let target=null,workStart=0,workDuration=2200,lastWork=0;
function closestStation(){let best=null,dist=Infinity;for(const s of stations){const d=Math.hypot(s.x-player.x,s.z-player.z);if(d<dist){best=s;dist=d}}return dist<7?best:null}
function stationAction(s){if(s.type==='mine'){const id=Math.random()<.48?'tin':'copper';if(Object.values(state.inv).reduce((a,b)=>a+b,0)>=60){toast('Pack is full — sell items from your journal');return}add(id);state.focus='mining';gain('mining',8);log(`Mined <b>${id} ore</b> from the seam.`);if(Math.random()<.025)add('gem')}
if(s.type==='forge'){state.focus='smithing';if(count('copper')&&count('tin')){remove('copper');remove('tin');add('bronze');gain('smithing',14);log('Smelted a <b>bronze bar</b>.')}else if(count('bronze')>=3){remove('bronze',3);state.equipped='bronze';gain('smithing',25);log('Forged a <b>bronze pickaxe</b>.')}else{toast('Bring 1 copper + 1 tin ore to smelt a bronze bar.');return}}
if(s.type==='woods'){if(Object.values(state.inv).reduce((a,b)=>a+b,0)>=60){toast('Pack is full — sell items from your journal');return}state.focus='woodcutting';add('logs');gain('woodcutting',10);log('Chopped <b>oak logs</b> from the grove.')}

function interact(){const s=closestStation();if(!s){toast('Walk closer to a station');return}const now=performance.now();if(now-lastWork<workDuration)return;lastWork=now;target=s;workStart=now;workDuration=s.type==='forge'?2300:1800;state.running=true;$('#prompt-name').textContent=s.type==='mine'?'Mining the seam':s.type==='forge'?'Working at the forge':s.type==='woods'?'Chopping oak':'Fishing the river';$('#work-progress').style.width='0%'}
function draw(now){if(!W||!H){requestAnimationFrame(draw);return}ctx.setTransform(D,0,0,D,0,0);const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#83aaa8');sky.addColorStop(.43,'#c4d2bd');sky.addColorStop(1,'#e1d7b8');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);const horizon=H*.44;ctx.fillStyle='#9aafa0';ctx.beginPath();ctx.moveTo(0,horizon+15);ctx.lineTo(W*.13,horizon-55);ctx.lineTo(W*.24,horizon-12);ctx.lineTo(W*.37,horizon-82);ctx.lineTo(W*.52,horizon-20);ctx.lineTo(W*.69,horizon-66);ctx.lineTo(W*.83,horizon-8);ctx.lineTo(W,horizon-48);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();ctx.fillStyle='#718d7e';ctx.beginPath();ctx.moveTo(0,horizon+25);for(let x=0;x<=W+40;x+=40)ctx.lineTo(x,horizon-24-Math.sin(x*.012)*23-Math.sin(x*.037)*11);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();const land=ctx.createLinearGradient(0,horizon,0,H);land.addColorStop(0,'#839878');land.addColorStop(1,'#9b9b74');ctx.fillStyle=land;ctx.fillRect(0,horizon+22,W,H-horizon);poly3([[-90,0,-12],[90,0,-12],[90,0,8],[-90,0,8]],'#839878');
 // winding earth track
